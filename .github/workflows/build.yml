name: Build single HTML

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python src/build.py
      - name: Record source revision
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python -c 'import os,pathlib; pathlib.Path("dist/SOURCE_COMMIT.txt").write_text(os.environ["SOURCE_COMMIT"] + "\n")'
      - uses: actions/upload-artifact@v4
        with:
          name: OrcaTarot-${{ github.sha }}
          path: dist/
          retention-days: 14
          if-no-files-found: error
