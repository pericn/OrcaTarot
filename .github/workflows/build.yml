name: Build and verify static site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python src/build.py
        env:
          SOURCE_COMMIT: ${{ github.sha }}
      - name: Install browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/orca-tests" playwright@1.58.0
          "$RUNNER_TEMP/orca-tests/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}
      - name: Browser acceptance
        run: |
          python tools/serve.py 8765 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/orca-http.log" 2>&1 &
          trap 'kill $!' EXIT
          BROWSER_ENGINE=${{ matrix.browser }} NODE_PATH="$RUNNER_TEMP/orca-tests/node_modules" node tests/browser.cjs http://127.0.0.1:8765/ "$RUNNER_TEMP/orca-qa"
      - name: Check complete site manifest
        run: cd dist && sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: OrcaTarot-${{ github.sha }}-${{ matrix.browser }}
          path: dist/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OrcaTarot-QA-${{ github.sha }}-${{ matrix.browser }}
          path: ${{ runner.temp }}/orca-qa/
          retention-days: 14
