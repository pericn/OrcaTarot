<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="鲸灵匣">
<meta name="theme-color" content="#fcfcfa">
<title>鲸灵匣 · Tarot de Marseille</title>
<link rel="icon" href="assets/motifs/star.webp" type="image/webp">
<link rel="apple-touch-icon" href="assets/app-icon.png">
<link rel="preload" href="assets/fonts/orca-woodblock.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div class="page-motifs" aria-hidden="true"><img class="motif sun" src="assets/motifs/sun.webp" alt=""><img class="motif moon" src="assets/motifs/moon.webp" alt=""><img class="motif star s1" src="assets/motifs/star.webp" alt=""><img class="motif star s2" src="assets/motifs/star.webp" alt=""><img class="motif star s3" src="assets/motifs/star.webp" alt=""></div>
<div class="wrap">
<header class="top"><div class="brand" role="button" tabindex="0" aria-label="鲸灵匣，连续点按三次查看安装引导"><h1>鲸灵匣</h1><p>TAROT DE MARSEILLE</p></div><button class="theme-btn" id="themeBtn" aria-label="切换明暗主题"></button></header>
<main>
<div class="reading-tools"><button class="sp-ind" id="spreadInd" aria-label="选择牌阵"><span id="spreadIcon"></span><span id="spreadName"></span><svg class="ico chevron" aria-hidden="true"><use href="assets/icons.svg#chevron"/></svg></button>
<div class="reading-options"><label class="sw"><input type="checkbox" id="tMinor" checked><span>小阿尔卡纳</span></label><label class="sw"><input type="checkbox" id="tRev"><span>逆位</span></label></div></div>
<section id="draw" aria-label="选牌"><div class="slotstage"><div class="slots" id="slots" data-n="3"></div></div>
<div class="fanzone" id="fanzone"><div class="fanprompt" id="fanPrompt" aria-live="polite"></div><div id="fanMid" hidden></div><div id="fanWrap" aria-label="扇形牌堆，左右滑动或用方向键选牌"><div id="fanTrack"></div></div><div id="bdayEmpty" hidden><button class="btn" id="bdayGo">填写生日</button></div></div></section>
<section id="reveal" aria-label="翻牌" hidden><div class="rv-prompt" id="rvPrompt" aria-live="polite"></div><div class="rv-row pre" id="rvRow" data-n="3"></div><div class="rv-supplement"><div class="rv-hidden" id="rvHidden" hidden><div class="rvh-cap">隐藏牌</div><div class="rcard hs" id="hCard"></div></div><div class="rv-extra" id="rvExtra" hidden></div></div><div class="rv-acts"><button class="btn" id="reShuffle"><svg class="ico" aria-hidden="true"><use href="assets/icons.svg#shuffle"/></svg>重新洗牌</button><button class="btn primary" id="shareBtn" hidden><svg class="ico" aria-hidden="true"><use href="assets/icons.svg#share"/></svg>分享</button></div></section>
</main>
<nav class="main-nav" aria-label="主导航"><button id="drawBtn" aria-current="page"><svg class="ico" aria-hidden="true"><use href="assets/icons.svg#cards"/></svg>抽牌</button><button id="historyBtn"><svg class="ico" aria-hidden="true"><use href="assets/icons.svg#history"/></svg>抽牌记录</button></nav>
</div>
<div id="spreadOv" role="dialog" aria-modal="true" aria-labelledby="spreadTitle" hidden><div class="bd" id="spreadBd"></div><div class="sh-sheet"><div class="sheet-top"><button class="icon-btn" id="spreadClose" aria-label="返回抽牌"><svg class="ico" aria-hidden="true"><use href="assets/icons.svg#back"/></svg></button><h2 id="spreadTitle">选择牌阵</h2></div><div class="spread-choices">
<div class="sp-row" data-s="1"><button class="sp-head" aria-label="单牌阵"><svg class="spread-diagram" aria-hidden="true"><use href="assets/icons.svg#spread-1"/></svg></button></div>
<div class="sp-row" data-s="2"><button class="sp-head" aria-label="双牌阵"><svg class="spread-diagram" aria-hidden="true"><use href="assets/icons.svg#spread-2"/></svg></button></div>
<div class="sp-row" data-s="3"><button class="sp-head" aria-label="三张牌阵"><svg class="spread-diagram" aria-hidden="true"><use href="assets/icons.svg#spread-3"/></svg></button></div>
<div class="sp-row" data-s="bday" id="bdayRow"><button class="sp-head" aria-label="生日牌阵" id="bdayHead"><svg class="spread-diagram" aria-hidden="true"><use href="assets/icons.svg#spread-bday"/></svg><span>生日牌阵</span></button></div>
</div><span id="sp3Sub" hidden></span><div class="bday-form" id="bdayForm" hidden><div class="bf-row"><input id="bY" type="number" inputmode="numeric" placeholder="年" min="1900" max="2100" aria-label="出生年"><input id="bM" type="number" inputmode="numeric" placeholder="月" min="1" max="12" aria-label="出生月"><input id="bD" type="number" inputmode="numeric" placeholder="日" min="1" max="31" aria-label="出生日"></div><button class="btn" id="bStart">开始发牌</button><p class="bf-err" id="bErr" role="alert" hidden></p></div></div></div>
<!-- ========== 分享预览浮层 ========== -->
<div id="shareOv" hidden>
  <div class="sh-card"><img id="shareImg" alt="分享截图"></div>
  <p class="sh-hint">长按图片保存到相册 · 或发送给朋友</p>
  <button class="btn sm" id="shareClose"><svg class="ico" aria-hidden="true"><use href="assets/icons.svg#back"/></svg>返回</button>
</div>

<!-- ========== 添加到主屏幕引导（仅 iOS Safari 首次） ========== -->
<div id="guideOv" hidden>
  <div class="gd-card">
    <button class="gd-close" id="guideClose" aria-label="关闭引导">←</button>
    <p class="gd-kicker">A D D &nbsp; T O &nbsp; H O M E</p>
    <h2 class="gd-title">把鲸灵匣放到桌面上</h2>
    <p class="gd-sub">以后像 App 一样，点一下就开</p>
    <ol class="gd-steps">
      <li class="gd-step">
        <p class="gd-s-t"><b>1</b>点屏幕最下面的<em>更多</em>按钮，再点<em>共享</em></p>
        <div class="gd-img gd-img-shot">
          <img id="gdImgMenu" src="" alt="Safari 菜单里的共享">
        </div>
      </li>
      <li class="gd-step">
        <p class="gd-s-t"><b>2</b>在菜单里找到<em>添加到主屏幕</em>，点这一行</p>
        <div class="gd-img gd-img-shot">
          <img id="gdImgShot" src="" alt="共享菜单里的添加到主屏幕">
        </div>
      </li>
      <li class="gd-step gd-done">
        <p class="gd-s-t"><b>3</b>打开<em>作为网页 App 打开</em>开关，再点<em>添加</em></p>
        <div class="gd-img gd-img-shot">
          <img id="gdImgWebapp" src="" alt="作为网页 App 打开开关">
        </div>
        <p class="gd-warn">不开这个开关，加的只是书签，点开还在 Safari 里</p>
      </li>
    </ol>
    <button class="btn" id="guideOk">好 的</button>
  </div>
</div>

<!-- ========== 历史抽卡记录（iOS webapp 全屏页） ========== -->
<div id="historyOv" hidden>
  <div class="hd-head">
    <p class="sh-title">抽 卡 记 录</p>
    <button class="btn danger" id="historyClear" hidden>清空记录</button>
    <button class="hd-close" id="historyClose" aria-label="返回抽牌"><svg class="ico" aria-hidden="true"><use href="assets/icons.svg#back"/></svg></button>
  </div>
  <div class="hd-list" id="historyList"></div>
  <div class="hd-foot">
    <span class="hd-count" id="historyCount"></span>
  </div>
</div>

</body>
</html>
